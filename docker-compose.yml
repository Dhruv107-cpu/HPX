services:
  postgres:
    image: postgres:15

    container_name: hpx_postgres

    restart: always

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
      POSTGRES_DB: hpx_db

    ports:
      - "5432:5432"

    volumes:
      - hpx_postgres_data:/var/lib/postgresql/data

volumes:
  hpx_postgres_data: